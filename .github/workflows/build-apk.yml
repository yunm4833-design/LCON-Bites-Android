name: Build LCON BITES APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform using preinstalled SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reuse validated offline map and restaurant snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets
          # Use the last successful verified offline APK as the data source.
          # No Overpass dependency during ordinary UI builds.
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/13812174291/zip" \
            -o /tmp/lcon-previous.zip
          unzip -oq /tmp/lcon-previous.zip -d /tmp/lcon-previous
          unzip -p /tmp/lcon-previous/app-debug.apk assets/leeds_roads.json > app/src/main/assets/leeds_roads.json
          unzip -p /tmp/lcon-previous/app-debug.apk assets/leeds_food.json > app/src/main/assets/leeds_food.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("app/src/main/assets")
          roads = len(json.loads((root/"leeds_roads.json").read_text())["roads"])
          food = len(json.loads((root/"leeds_food.json").read_text())["places"])
          print(f"Validated offline snapshot: {roads} roads, {food} places")
          assert roads >= 100 and food >= 35
          PY
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LCON-BITES-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
